name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: go.sum

      - name: Lint by go vet
        run: go vet ./...

      - name: Lint by golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1

  test:
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.27.0'
            coverage: true
          - os: macos-latest
            go: '1.27.0'
            coverage: false
          - os: windows-latest
            go: '1.27.0'
            coverage: false
          - os: ubuntu-latest
            go: '1.26.6'
            coverage: false
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Run unit tests
        run: go test -v ./...

      - name: Generate coverage report
        if: matrix.coverage
        run: >-
          go test
          -coverpkg=./api,./errors,./internal/client
          -coverprofile=coverage.txt
          ./api ./errors ./internal/client ./models

      - name: Run race detector
        if: matrix.coverage
        run: go test -race ./...

      - name: Upload coverage report to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          disable_search: true
          fail_ci_if_error: true
